{% if theme_pytorch_project in ['docs', 'tutorials'] %}
<div class="search-container-wrapper">
  <div id="sphinx-search" class="search-container">
    <div class="pagefind-search-wrapper">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="text" class="pagefind-search-input" id="pagefind-nav-input"
             placeholder="Search the docs ..." autocomplete="off">
      <div class="pagefind-search-results" id="pagefind-nav-results" style="display: none;">
        <ul class="pagefind-search-results__list" id="pagefind-nav-results-list"></ul>
      </div>
    </div>
  </div>

  <div id="google-search" class="search-container" style="display:none;">
    <form class="bd-search d-flex align-items-center" id="google-search-form">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search"
             class="form-control"
             id="google-search-input"
             placeholder="{{ theme_search_bar_text }}"
             aria-label="{{ theme_search_bar_text }}"
             autocomplete="off"
             autocorrect="off"
             autocapitalize="off"
             spellcheck="false"/>
    </form>
    <div id="google-search-suggestions" class="google-search-suggestions"></div>
    <div class="gcse-searchresults-only"></div>
  </div>

  <div class="search-toggle-container" data-bs-title="Google Search Off" data-bs-placement="bottom" data-bs-toggle="tooltip">
    <div class="search-toggle-inner">
      <label class="switch">
        <input type="checkbox" id="search-toggle">
        <span class="slider round"></span>
      </label>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
  // Define the search callback
  const myWebSearchStartingCallback = (gname, query) => {
    if (typeof dataLayer !== 'undefined' && query) {
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({
        'event': 'google_search',
        'search_term': query,
        'event_category': 'Search',
        'event_label': 'Google Search'
      });
    }
    return '';
  };

  // Set up the GCSE search callbacks
  window.__gcse || (window.__gcse = {});
  window.__gcse.searchCallbacks = {
    web: { starting: myWebSearchStartingCallback }
  };

  if (window.location.pathname.includes('/search.html')) {
    document.body.classList.add('search-page');
  }

  // Function to reinitialize Google CSE and show fallback if needed
  function reinitializeGoogleSearch() {
    // Use Google's official render API to re-render the search element
    if (window.google && window.google.search && window.google.search.cse && window.google.search.cse.element) {
      var el = window.google.search.cse.element.getElement('standard0');
      if (!el) {
        window.google.search.cse.element.render({div: 'google-search', tag: 'search'});
      }
      return;
    }

    // CSE not loaded — show fallback input after a short delay
    setTimeout(function() {
      var gcseDiv = document.querySelector('#google-search .gcse-search');
      var fallback = document.getElementById('gcse-fallback-input');
      if (fallback && gcseDiv && gcseDiv.children.length === 0) {
        gcseDiv.style.display = 'none';
        fallback.style.display = '';
      }
    }, 1500);
  }

  // Wire up the fallback input to Google search
  var fallbackInput = document.getElementById('gcse-fallback-input');
  if (fallbackInput) {
    fallbackInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var q = this.value.trim();
        if (q) {
          window.open('https://www.google.com/search?q=' + encodeURIComponent(q + ' site:pytorch.org'), '_blank');
        }
      }
    });
  }

  // Execute Google CSE search programmatically from our custom input
  function executeGoogleSearch(query) {
    if (!query) return;

    // Close mobile sidebar if open, so results overlay is visible
    var sidebar = document.querySelector('.bd-sidebar-primary');
    if (sidebar && sidebar.classList.contains('show')) {
      var closeBtn = sidebar.querySelector('[data-bs-dismiss="offcanvas"]');
      if (closeBtn) closeBtn.click();
      // Also try Bootstrap's offcanvas API
      try {
        var offcanvas = bootstrap.Offcanvas.getInstance(sidebar);
        if (offcanvas) offcanvas.hide();
      } catch(e) {}
    }

    var element = google.search.cse.element.getElement('searchresults-only0');
    if (element) {
      element.execute(query);
    }
  }

  // Wire up our custom Google search input
  var googleSearchForm = document.getElementById('google-search-form');
  var googleSearchInput = document.getElementById('google-search-input');

  if (googleSearchForm) {
    googleSearchForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var query = googleSearchInput ? googleSearchInput.value : '';
      executeGoogleSearch(query);
    });
  }

  var suggestDebounce;
  var activeSuggestionIndex = -1;

  if (googleSearchInput) {
    // Trigger search on Enter key
    googleSearchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        hideSuggestions();
        executeGoogleSearch(this.value);
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        navigateSuggestions(e.key === 'ArrowDown' ? 1 : -1);
      } else if (e.key === 'Escape') {
        hideSuggestions();
      }
    });

    googleSearchInput.addEventListener('input', function() {
      clearTimeout(suggestDebounce);
      var query = this.value.trim();
      activeSuggestionIndex = -1;
      if (query.length < 2) {
        hideSuggestions();
        return;
      }
      suggestDebounce = setTimeout(function() {
        fetchGoogleSuggestions(query);
      }, 200);
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#google-search')) {
        hideSuggestions();
      }
    });
  }

  // Filter and clean suggestions: keep only PyTorch-related, strip prefix
  function cleanSuggestions(rawList) {
    return rawList.map(function(s) {
      var text = typeof s === 'string' ? s : s[0];
      return text;
    }).filter(function(text) {
      return /pytorch/i.test(text);
    }).map(function(text) {
      return text.replace(/^pytorch\s*/i, '');
    }).filter(function(s) {
      return s.length > 0;
    });
  }

  // Fetch suggestions from Google suggest API, scoped to PyTorch
  function fetchGoogleSuggestions(query) {
    var scopedQuery = 'pytorch ' + query;
    fetch('https://suggestqueries.google.com/complete/search?client=firefox&q=' + encodeURIComponent(scopedQuery))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data[1] && data[1].length) {
          var cleaned = cleanSuggestions(data[1]);
          cleaned.length ? showSuggestions(cleaned) : hideSuggestions();
        } else {
          hideSuggestions();
        }
      })
      .catch(function() {
        fetchGoogleSuggestionsJSONP(scopedQuery);
      });
  }

  function fetchGoogleSuggestionsJSONP(scopedQuery) {
    var script = document.getElementById('gcse-suggest-script');
    if (script) script.remove();

    window.__gcseSuggestCallback = function(data) {
      if (data && data[1] && data[1].length) {
        var cleaned = cleanSuggestions(data[1]);
        cleaned.length ? showSuggestions(cleaned) : hideSuggestions();
      } else {
        hideSuggestions();
      }
    };

    script = document.createElement('script');
    script.id = 'gcse-suggest-script';
    script.src = 'https://clients1.google.com/complete/search?client=hp&q=' + encodeURIComponent(scopedQuery) + '&callback=__gcseSuggestCallback';
    script.onerror = function() { hideSuggestions(); };
    document.head.appendChild(script);
  }

  function stripHtml(str) {
    var tmp = document.createElement('div');
    tmp.innerHTML = str;
    return tmp.textContent || tmp.innerText || '';
  }

  function showSuggestions(suggestions) {
    var container = document.getElementById('google-search-suggestions');
    if (!container || !suggestions.length) { hideSuggestions(); return; }

    container.innerHTML = '';
    suggestions.forEach(function(rawText, index) {
      var text = stripHtml(rawText);
      var item = document.createElement('div');
      item.className = 'google-suggest-item';
      item.textContent = text;
      item.setAttribute('data-index', index);
      item.addEventListener('click', function() {
        googleSearchInput.value = text;
        hideSuggestions();
        executeGoogleSearch(text);
      });
      item.addEventListener('mouseenter', function() {
        activeSuggestionIndex = index;
        highlightSuggestion();
      });
      container.appendChild(item);
    });
    container.style.display = 'block';
    activeSuggestionIndex = -1;
  }

  function hideSuggestions() {
    var container = document.getElementById('google-search-suggestions');
    if (container) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
    activeSuggestionIndex = -1;
    // Clean up JSONP script
    var script = document.getElementById('gcse-suggest-script');
    if (script) script.remove();
  }

  function navigateSuggestions(direction) {
    var items = document.querySelectorAll('#google-search-suggestions .google-suggest-item');
    if (!items.length) return;

    activeSuggestionIndex += direction;
    if (activeSuggestionIndex >= items.length) activeSuggestionIndex = 0;
    if (activeSuggestionIndex < 0) activeSuggestionIndex = items.length - 1;

    highlightSuggestion();
    googleSearchInput.value = items[activeSuggestionIndex].textContent;
  }

  function highlightSuggestion() {
    var items = document.querySelectorAll('#google-search-suggestions .google-suggest-item');
    items.forEach(function(item, i) {
      item.classList.toggle('active', i === activeSuggestionIndex);
    });
  }

  // Function to handle search toggle
  function handleSearchToggle(toggle, sphinxSearch, googleSearch) {
    if (!toggle || !sphinxSearch || !googleSearch) return;

    // TODO: We've had reports that the google programmable search is returning stale documentation,
    //       Simple reproduction is to turn google search on and search for multinomial which will
    //       result in returning 1.8.1 documentation.
    //       We should turn this back on when we resolve that bug.
    const shouldDefaultToGoogle = false;
    const savedPreference = localStorage.getItem('searchPreference');

    // Set initial state
    if (savedPreference === 'google' || (savedPreference === null && shouldDefaultToGoogle)) {
      toggle.checked = true;
      sphinxSearch.style.display = 'none';
      googleSearch.style.display = 'block';
      if (savedPreference === null) {
        localStorage.setItem('searchPreference', 'google');
      }
      reinitializeGoogleSearch();
    } else {
      toggle.checked = false;
      sphinxSearch.style.display = 'block';
      googleSearch.style.display = 'none';
    }

    // Update tooltip
    updateTooltip(toggle.checked);

    // Skip if already initialized
    if (toggle.hasAttribute('data-initialized')) return;
    toggle.setAttribute('data-initialized', 'true');

    toggle.addEventListener('change', function() {
      if (this.checked) {
        sphinxSearch.style.display = 'none';
        googleSearch.style.display = 'block';
        localStorage.setItem('searchPreference', 'google');
        reinitializeGoogleSearch();
        trackSearchEngineSwitch('Google');
        // Focus our custom input when switching to Google
        if (googleSearchInput) googleSearchInput.focus();
      } else {
        sphinxSearch.style.display = 'block';
        googleSearch.style.display = 'none';
        localStorage.setItem('searchPreference', 'sphinx');
        trackSearchEngineSwitch('Pagefind');
      }

      updateTooltip(this.checked);
      updateMobileSearch();
    });
  }

  // Update tooltip based on toggle state
  function updateTooltip(isChecked) {
    const tooltipElement = document.querySelector('.search-toggle-container');
    if (!tooltipElement) return;

    tooltipElement.setAttribute('data-bs-title', isChecked ? 'Google Search On' : 'Google Search Off');

    if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
      const tooltipInstance = bootstrap.Tooltip.getInstance(tooltipElement);
      if (tooltipInstance) tooltipInstance.dispose();
      new bootstrap.Tooltip(tooltipElement);
    }
  }

  // Track search engine switch
  function trackSearchEngineSwitch(engine) {
    if (typeof dataLayer !== 'undefined') {
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({
        'event': 'search_engine_switch',
        'event_category': 'Search',
        'event_label': engine
      });
    }
  }

  // Function to update mobile search based on current toggle state
  function updateMobileSearch() {
    const toggle = document.getElementById('search-toggle');
    if (!toggle) return;

    const mobileSearchContainer = document.querySelector('.sidebar-header-items__end .navbar-item .search-container-wrapper');
    if (!mobileSearchContainer) return;

    const mobileSphinxSearch = mobileSearchContainer.querySelector('#sphinx-search');
    const mobileGoogleSearch = mobileSearchContainer.querySelector('#google-search');

    if (mobileSphinxSearch && mobileGoogleSearch) {
      mobileSphinxSearch.style.display = toggle.checked ? 'none' : 'block';
      mobileGoogleSearch.style.display = toggle.checked ? 'block' : 'none';

      if (toggle.checked) {
        reinitializeGoogleSearch();
      }
    }
  }

  // Initialize desktop search toggle
  const toggle = document.getElementById('search-toggle');
  const sphinxSearch = document.getElementById('sphinx-search');
  const googleSearch = document.getElementById('google-search');
  handleSearchToggle(toggle, sphinxSearch, googleSearch);

  // Fix for scroll jump issue - improved approach
  function setupSearchInputHandlers(input) {
    if (input.hasAttribute('data-scroll-fixed')) return;
    input.setAttribute('data-scroll-fixed', 'true');

    let lastScrollPosition = 0;
    let isTyping = false;
    let scrollTimeout;

    input.addEventListener('keydown', () => {
      lastScrollPosition = window.scrollY;
      isTyping = true;
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => { isTyping = false; }, 100);
    });

    function maintainScroll() {
      if (document.activeElement === input && isTyping) {
        window.scrollTo(0, lastScrollPosition);
        requestAnimationFrame(maintainScroll);
      }
    }

    input.addEventListener('focus', () => {
      lastScrollPosition = window.scrollY;
    });

    input.addEventListener('input', () => {
      isTyping = true;
      window.scrollTo(0, lastScrollPosition);
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => { isTyping = false; }, 100);
      requestAnimationFrame(maintainScroll);
    });
  }

  function applyToSearchInputs() {
    document.querySelectorAll('.search-container input').forEach(setupSearchInputHandlers);
  }

  applyToSearchInputs();

  const searchObserver = new MutationObserver(applyToSearchInputs);
  searchObserver.observe(document.body, { childList: true, subtree: true });

  // ==========================================
  // Pagefind result cleanup helpers
  // ==========================================
  function cleanTitle(title) {
    return (title || '').replace(/#\s*$/g, '').replace(/\s*#\s*/g, ' ').trim();
  }
  function cleanExcerpt(excerpt) {
    if (!excerpt) return '';
    var cleaned = excerpt.replace(/<(?!\/?mark)[^>]+>/gi, '');
    cleaned = cleaned.replace(/Created On:[^|.]*(\|[^|.]*)*\.?\s*/gi, '');
    cleaned = cleaned.replace(/Last (Updated|Verified) On:[^|.]*(\|[^|.]*)*\.?\s*/gi, '');
    cleaned = cleaned.replace(/Rate this Page[\s★☆✩✪⭐]*\.?\s*/gi, '');
    cleaned = cleaned.replace(/[★☆✩✪⭐]{2,}/g, '');
    cleaned = cleaned.replace(/Run in Google Colab\.?\s*/gi, '');
    cleaned = cleaned.replace(/Download Notebook\.?\s*/gi, '');
    cleaned = cleaned.replace(/View on GitHub\.?\s*/gi, '');
    cleaned = cleaned.replace(/\b(Colab|Notebook|GitHub)\.\s*/g, '');
    cleaned = cleaned.replace(/Skip to main content\.?\s*/gi, '');
    cleaned = cleaned.replace(/Back to top\.?\s*/gi, '');
    cleaned = cleaned.replace(/PyPi\s*/gi, '');
    cleaned = cleaned.replace(/Theme Documentation\.?\s*/gi, '');
    cleaned = cleaned.replace(/\s{2,}/g, ' ').replace(/^\s*[.\s]+/, '').trim();
    if (cleaned.length > 120) {
      cleaned = cleaned.substring(0, 120).replace(/\s+\S*$/, '') + '...';
    }
    return cleaned;
  }

  // ==========================================
  // Pagefind navbar search
  // ==========================================
  var pfInput = document.getElementById('pagefind-nav-input');
  var pfResultsContainer = document.getElementById('pagefind-nav-results');
  var pfResultsList = document.getElementById('pagefind-nav-results-list');
  var pfDebounce = null;

  if (pfInput && pfResultsContainer && pfResultsList && !pfInput.hasAttribute('data-pagefind-bound')) {
    pfInput.setAttribute('data-pagefind-bound', 'true');
    pfInput.addEventListener('input', function() {
      var q = this.value.trim();
      clearTimeout(pfDebounce);
      if (!q || q.length < 2) {
        pfResultsContainer.style.display = 'none';
        return;
      }
      pfDebounce = setTimeout(async function() {
        var pf = await window._pagefindReady;
        if (!pf) {
          pfResultsContainer.style.display = 'none';
          return;
        }
        var search = await pf.search(q);
        pfResultsList.innerHTML = '';
        if (search.results.length === 0) {
          pfResultsList.innerHTML = '<li class="pagefind-search-results__empty">No results found</li>';
        } else {
          var dataResults = await Promise.all(
            search.results.slice(0, 10).map(function(r) { return r.data(); })
          );
          var qLower = q.toLowerCase();
          dataResults.sort(function(a, b) {
            var aTitle = (a.meta.title || '').toLowerCase();
            var bTitle = (b.meta.title || '').toLowerCase();
            var aInTitle = aTitle.indexOf(qLower) !== -1;
            var bInTitle = bTitle.indexOf(qLower) !== -1;
            if (aInTitle && !bInTitle) return -1;
            if (!aInTitle && bInTitle) return 1;
            return 0;
          });
          dataResults.forEach(function(d) {
            var title = cleanTitle(d.meta.title || d.url);
            var excerpt = cleanExcerpt(d.excerpt);
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = d.url;
            a.className = 'pagefind-search-results__link';
            a.innerHTML = '<span class="pagefind-search-results__title">' + title + '</span>';
            if (excerpt) {
              a.innerHTML += '<span class="pagefind-search-results__excerpt">' + excerpt + '</span>';
            }
            li.appendChild(a);
            pfResultsList.appendChild(li);
          });
          if (search.results.length > 10) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = 'search.html?q=' + encodeURIComponent(pfInput.value.trim());
            a.className = 'pagefind-search-results__see-all';
            a.textContent = 'See all ' + search.results.length + ' results →';
            li.appendChild(a);
            pfResultsList.appendChild(li);
          }
        }
        pfResultsContainer.style.display = '';
      }, 150);
    });

    pfInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var q = this.value.trim();
        if (q) window.location.href = 'search.html?q=' + encodeURIComponent(q);
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.pagefind-search-wrapper')) {
        pfResultsContainer.style.display = 'none';
      }
    });

    pfInput.addEventListener('focus', function() {
      if (this.value.trim() && pfResultsList.children.length > 0) {
        pfResultsContainer.style.display = '';
      }
    });
  }

  // Watch for mobile menu creation
  const mobileMenuObserver = new MutationObserver(function(mutations) {
    for (const mutation of mutations) {
      if (!mutation.addedNodes.length) continue;

      const mobileSearchContainer = document.querySelector('.sidebar-header-items__end .navbar-item .search-container-wrapper');
      if (!mobileSearchContainer) continue;

      const mobileToggle = mobileSearchContainer.querySelector('#search-toggle');
      if (mobileToggle && toggle) {
        mobileToggle.checked = toggle.checked;
        updateMobileSearch();

        if (!mobileToggle.hasAttribute('data-initialized')) {
          mobileToggle.setAttribute('data-initialized', 'true');
          mobileToggle.addEventListener('change', function() {
            toggle.checked = this.checked;
            toggle.dispatchEvent(new Event('change'));
          });
        }
      }

      // Wire up mobile Google search input
      var mobileGoogleInput = mobileSearchContainer.querySelector('#google-search-input');
      if (mobileGoogleInput && !mobileGoogleInput.hasAttribute('data-mobile-wired')) {
        mobileGoogleInput.setAttribute('data-mobile-wired', 'true');

        var mobileForm = mobileSearchContainer.querySelector('#google-search-form');
        if (mobileForm) {
          mobileForm.addEventListener('submit', function(e) {
            e.preventDefault();
            executeGoogleSearch(mobileGoogleInput.value);
          });
        }

        mobileGoogleInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            executeGoogleSearch(this.value);
          }
        });

        mobileGoogleInput.addEventListener('input', function() {
          clearTimeout(suggestDebounce);
          var query = this.value.trim();
          activeSuggestionIndex = -1;
          if (query.length < 2) return;
          suggestDebounce = setTimeout(function() {
            // Mobile uses the same search execution but no suggestions dropdown
            // (suggestions dropdown is complex on mobile; just support Enter to search)
          }, 200);
        });
      }
    }
  });

  mobileMenuObserver.observe(document.body, { childList: true, subtree: true });

  // Ensure Google CSE is properly loaded
  if (window.__gcse) {
    window.__gcse.callback = function() {
      if (toggle && toggle.checked) {
        reinitializeGoogleSearch();
      }
    };
  } else {
    window.__gcse = {
      callback: function() {
        if (toggle && toggle.checked) {
          reinitializeGoogleSearch();
        }
      }
    };
  }
});
</script>
{% else %}
  {% include "search-field.html" %}
{% endif %}
