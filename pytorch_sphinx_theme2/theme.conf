[theme]

inherit = pydata_sphinx_theme
stylesheet = css/theme.css

[options]
# Navigation options
navbar_align = left
navbar_start = navbar-logo
navbar_center = navbar-nav
navbar_end = search-field-custom, theme-switcher, navbar-icon-links
navbar_persistent =
collapse_navigation = False
show_prev_next = False
display_version = True
logo_text = "Home"
language_bindings_links =
version_info =
extra_project_links =
# Enable dropdown menus in horizontal navbar for items with children
# Set to false to show only flat links (no dropdowns)
enable_navbar_dropdowns = true
# Article layout
article_header_start = breadcrumbs
article_header_end = rate_page.html
secondary_sidebar_items = page-toc, edit-this-page, sourcelink
article_footer_items = footer-rating.html
use_edit_page_button = True

# Project info
pytorch_project =
canonical_url =
analytics_id =

# Header and Footer control
show_lf_header = false
show_lf_footer = true

# RunLLM Widget Configuration
# Set runllm_assistant_id to enable the widget (required)
runllm_assistant_id =
runllm_name = Assistant
runllm_position = BOTTOM_RIGHT
# PyTorch.org site link (shown in navbar on desktop, sidebar on mobile)
show_pytorch_org_link = True

# Announcement Banner Configuration
# Enable to display a dismissible banner at the top of article content
# Useful for surveys, event announcements, release notes, deprecation notices, etc.
announcement_banner_enabled = false
announcement_banner_text =
announcement_banner_url =
announcement_banner_link_text = Learn More
announcement_banner_dismissible = true

# LLM Discovery Configuration (llms.txt and meta tags)
# These options help AI agents and LLMs discover and navigate the documentation
#
# Domain for the documentation site (e.g., "docs.pytorch.org")
llm_domain =
# Base path after domain (e.g., "docs/", "vision/", "audio/")
# Combined with domain and version to form full URLs: https://{domain}/{base_path}{version}/
llm_base_path =
# Description of the site for LLMs (appears in llm:description meta tag)
llm_description =
# Set to false to enable llms.txt generation
# When enabled, URLs are resolved: llm_domain > html_baseurl > relative
llm_disabled = true
# Path to a custom llms.txt file (relative to Sphinx source directory).
# When set, this file is copied to the output instead of auto-generating one.
# If not set, a file named llms.txt in the source root is used automatically.
llm_custom_file =
